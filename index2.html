<!doctype html>
<html lang="en">
<head>
  <!-- PWA manifest (kept consistent with your main site) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1665D8">

  <!-- iOS icons / meta (same as main) -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/at-icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="IFD Navigator">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon.png">

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IFD Navigator – TNSELA</title>

  <style>
    :root{
      --bg:#fafafa;
      --text:#111;
      --muted:#6b7280;
      --card:#ffffff;
      --line:#e5e7eb;
      --accent:#f0eac2;
      --brand:#0f766e;
      --topbar-h:60px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
    a{color:var(--brand);text-decoration:none}

    header.topbar{
      position:sticky; top:0; z-index:10;
      background:#fff; border-bottom:1px solid var(--line);
    }
    .wrap{max-width:1100px; margin:0 auto; padding:0 16px}
    .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:10px 0}
    .brand{display:flex; gap:10px; align-items:center; padding:6px 10px; border-radius:10px; border:1px solid var(--line); background:#fff}
    .brand img{width:24px; height:24px}
    .brand:hover{background:#f9fafb}

    main{min-height:calc(100vh - var(--topbar-h)); display:grid; place-items:center; padding:24px}
    .panel{
      background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px;
      box-shadow:0 1px 2px rgba(0,0,0,.03); max-width:720px; width:100%; text-align:center;
    }
    h1{margin:.2rem 0 .25rem; font-size:1.4rem}
    p{margin:.5rem 0 0; color:var(--muted)}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <div class="row">
        <!-- If you have a custom icon, keep this consistent with the main site -->
        <a class="brand" href="#">
          <img src="icons/custom-home.png" alt="TNSELA">
          <strong>IFD Navigator</strong>
        </a>
      </div>
    </div>
  </header>

  <main>
    <div class="panel" role="status" aria-live="polite">
      <h1>TNSELA’s IFD Navigator</h1>
      <p>is a work in progress — check back soon.</p>
    </div>
  </main>

  <!-- (Optional) Disable service worker here so this page never gets cached over your live app) -->
  <!--
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
    }
  </script>
  -->
</body>
</html>
